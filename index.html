<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="KOAN×CLE" />
<title>KOAN・CLE 統合ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8;
    --ink:#13202e;
    --navy:#0b2f4d;
    --teal:#0d6e63;
    --gold:#b98a2f;
    --surface:#ffffff;
    --line:#d5dde4;
    --muted:#5a6b7a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e151c;
      --ink:#eef4f8;
      --navy:#2c5f8a;
      --teal:#177a6e;
      --gold:#e2b95c;
      --surface:#18222d;
      --line:#33434f;
      --muted:#9db0bf;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;margin:0 auto;padding:40px 20px 48px;
    min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;
  }
  h1{
    margin:0 0 12px;font-size:1.35rem;font-weight:900;letter-spacing:.04em;text-align:center;
  }
  h1 .amp{color:var(--gold)}
  .open-btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    text-decoration:none;color:#fff;border-radius:16px;
    padding:26px 20px;min-height:96px;text-align:center;
    transition:filter .15s ease, transform .15s ease;
  }
  .open-btn:hover{filter:brightness(1.1)}
  .open-btn:active{transform:scale(.985)}
  .open-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .open-btn .name{font-size:1.9rem;font-weight:900;letter-spacing:.08em;line-height:1.1}
  .open-btn .url{display:block;font-size:.8rem;font-weight:500;opacity:.8;letter-spacing:.02em;margin-top:4px}
  .open-btn.koan{background:var(--navy)}
  .open-btn.cle{background:var(--teal)}
  .open-btn svg{flex:none}
  .course-btn{
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:56px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .course-btn:hover{border-color:var(--teal)}
  .course-btn:active{transform:scale(.99)}
  .course-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .course-btn .slot{
    flex:none;min-width:52px;text-align:center;
    font-size:.78rem;font-weight:900;letter-spacing:.04em;
    color:var(--teal);border:1.5px solid var(--teal);border-radius:8px;
    padding:4px 6px;line-height:1.25;
  }
  .course-btn .cname{flex:1;font-size:1rem;font-weight:700;line-height:1.35}
  .course-btn svg{flex:none;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){ .open-btn,.course-btn{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>KOAN <span class="amp">×</span> CLE</h1>

  <a class="open-btn koan" href="https://koan.osaka-u.ac.jp/campusweb/campusportal.do?page=main&tabId=rs" target="_blank" rel="noopener noreferrer">

    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

</div>
</body>
</html>
